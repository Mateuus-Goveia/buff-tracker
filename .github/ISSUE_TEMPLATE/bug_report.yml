name: Bug report
description: Report a reproducible problem in Buff Tracker
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Before submitting, search existing issues and remove personal information from screenshots or logs.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: dropdown
    id: input_mode
    attributes:
      label: Input mode
      options:
        - Joystick/controller
        - Keyboard
        - Both / not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Screenshots or additional context
      description: Do not include personal settings files, private information, or unredacted logs.
